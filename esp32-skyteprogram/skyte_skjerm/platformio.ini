; ESP32-2432S028R ("Cheap Yellow Display"), 2,8" ILI9341 + XPT2046 touch
[platformio]
src_dir = .

[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../libraries
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  paulstoffregen/XPT2046_Touchscreen@1.4
build_flags =
  ; TFT_eSPI-oppsett for CYD (erstatter User_Setup.h)
  -DUSER_SETUP_LOADED=1
  -DILI9341_2_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DUSE_HSPI_PORT=1
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT7=1
  -DSPI_FREQUENCY=55000000
  -DSPI_READ_FREQUENCY=20000000
