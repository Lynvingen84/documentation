# ==================================================
# GARASJEPORT - Somfy Dexxo Smart io via Home Assistant
#
# Maskinvare: Seeed XIAO ESP32-C6
#
# VIKTIG - MASKINVARE FOER FLASHING:
#
#   GPIO1 (D1) trenger avstoeying. Uten dette kan
#   radiostoey utloese falske trykk:
#
#     - 10 kOhm motstand fra GPIO1 til 3V3
#       (ekstern pull-up, i tillegg til den interne)
#
#     - 100 nF kondensator fra GPIO1 til GND,
#       plassert saa naer kortet som mulig
#
#     - Tvunnet par eller skjermet kabel ut til
#       bryteren, med GND som returleder
# ==================================================

esphome:
  name: garasjeport
  friendly_name: GarasjePort

  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(system_ready) = false;
          id(click_count) = 0;
          id(motion_direction) = 0;
          id(stopped_direction) = 0;


esp32:
  variant: esp32c6
  framework:
    type: esp-idf


# ==================================================
# LOGGER
#
# baud_rate: 0 slaar av UART0.
#
# Paa ESP32-C6 er GPIO16 UART0 TX, og den pinnen
# brukes til roed LED. Uten dette blafrer roed LED
# i takt med all loggutskrift.
#
# Loggen er fortsatt tilgjengelig over API
# (esphome logs garasjeport.yaml).
#
# Trenger du seriell logg under feilsoeking, fjern
# baud_rate midlertidig OG koble roed LED fra GPIO16.
# ==================================================
logger:
  baud_rate: 0


# ==================================================
# WIFI
# ==================================================
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  manual_ip:
    static_ip: 192.168.68.134
    gateway: 192.168.68.1
    subnet: 255.255.255.0

  # Enhver endring i nettverkstilstand sperrer
  # portstyringen til systemet er trygt armert igjen.
  on_connect:
    - script.execute: arm_system

  on_disconnect:
    - script.execute: disarm_system


# ==================================================
# HOME ASSISTANT API
#
# Kryptert. Uten dette kan hvem som helst paa
# nettverket koble seg til enheten.
# ==================================================
api:
  encryption:
    key: !secret api_encryption_key

  # Naar en klient kobler til eller fra, gaar vi
  # gjennom armeringen paa nytt. Armeringen krever
  # gyldig portstatus fra HA, saa en ren loggklient
  # er ikke nok til aa armere systemet.
  on_client_connected:
    - script.execute: arm_system

  on_client_disconnected:
    - script.execute: arm_system


# ==================================================
# OTA
# ==================================================
ota:
  - platform: esphome
    password: !secret ota_password


# ==================================================
# GLOBALS
# ==================================================
globals:

  # Portkommandoer er kun tillatt naar denne er true
  - id: system_ready
    type: bool
    restore_value: no
    initial_value: 'false'

  # Teller trykk for enkelt/dobbelttrykk
  - id: click_count
    type: int
    restore_value: no
    initial_value: '0'

  # Retningen porten kjoerer naa:
  #  1 = aapner, -1 = lukker, 0 = staar stille
  - id: motion_direction
    type: int
    restore_value: no
    initial_value: '0'

  # Retningen porten gikk da vi stoppet den:
  #  1 = stoppet under aapning
  # -1 = stoppet under lukking
  #  0 = ikke stoppet manuelt
  - id: stopped_direction
    type: int
    restore_value: no
    initial_value: '0'

  # Oensket LED-farge:
  # 0 = av, 1 = groenn, 2 = roed, 3 = blaa
  - id: led_color
    type: int
    restore_value: no
    initial_value: '0'

  # Blinkefase naar systemet ikke er armert
  - id: blink_on
    type: bool
    restore_value: no
    initial_value: 'false'


# ==================================================
# RGB LED
#
# ROED   = D6 = GPIO16
# GROENN = D5 = GPIO23
# BLAA   = D4 = GPIO22
#
# Common cathode: felles pinne -> motstand -> GND
# ==================================================
output:

  - platform: gpio
    pin: GPIO16
    id: led_red

  - platform: gpio
    pin: GPIO23
    id: led_green

  - platform: gpio
    pin: GPIO22
    id: led_blue


# ==================================================
# PORTSTATUS FRA HOME ASSISTANT
# ==================================================
text_sensor:

  - platform: homeassistant
    id: dexxo_state
    entity_id: cover.dexxosmartio800

    on_value:
      then:
        - lambda: |-
            if (x == "opening") {
              id(motion_direction) = 1;
            }
            else if (x == "closing") {
              id(motion_direction) = -1;
            }
            else {
              id(motion_direction) = 0;
            }

        - script.execute: update_status_led


sensor:

  # Faktisk portposisjon 0-100 %
  - platform: homeassistant
    id: dexxo_position
    entity_id: cover.dexxosmartio800
    attribute: current_position

    on_value:
      then:
        - lambda: |-
            // Naar porten staar i endestilling er en
            // tidligere manuell stopp ikke relevant lenger.
            // Uten dette blir stopp-minnet staaende for
            // godt hvis porten kjoeres fra HA eller fra
            // den originale fjernkontrollen.
            if (x <= 1.0f || x >= 99.0f) {
              id(stopped_direction) = 0;
            }

        - script.execute: update_status_led


# ==================================================
# SCRIPTS
# ==================================================
script:

  # =================================================
  # SPERR PORTSTYRINGEN
  # =================================================
  - id: disarm_system
    mode: restart

    then:
      - script.stop: arm_system
      - script.stop: click_timer

      - lambda: |-
          id(system_ready) = false;
          id(click_count) = 0;

      - logger.log: "SYSTEM SPERRET"


  # =================================================
  # SIKKER ARMERING
  #
  # Systemet armeres foerst naar ALT er stabilt:
  #
  #   1. WiFi er oppe
  #   2. API-klient er tilkoblet
  #   3. Home Assistant har sendt gyldig portstatus
  #   4. Knappen har vaert sluppet i 3 sammenhengende
  #      sekunder
  #
  # Punkt 4 er det viktige. En enkelt stikkproeve av
  # pinnen er ikke nok - en ustabil inngang treffer
  # lett et rolig oeyeblikk og slipper gjennom.
  #
  # Slaar sjekken feil, proever scriptet paa nytt i
  # stedet for aa gi opp. Uten det ville enheten
  # kunne laase seg i ikke-armert tilstand for godt.
  # =================================================
  - id: arm_system
    mode: restart

    then:
      - script.stop: click_timer

      - lambda: |-
          id(system_ready) = false;
          id(click_count) = 0;

      - script.execute: update_status_led

      # Vent til alt er oppe. Ingen fast timeout -
      # scriptet venter saa lenge som noedvendig.
      - wait_until:
          condition:
            and:
              - wifi.connected:
              - api.connected:
              - binary_sensor.is_off: garasje_knapp
              - lambda: |-
                  return id(dexxo_state).has_state() &&
                         !id(dexxo_state).state.empty();

      # Krev at knappen er stabilt sluppet
      - delay: 3s

      - if:
          condition:
            and:
              - wifi.connected:
              - api.connected:
              - binary_sensor.is_off: garasje_knapp
              - lambda: |-
                  return id(dexxo_state).has_state() &&
                         !id(dexxo_state).state.empty();

          then:
            - lambda: |-
                id(click_count) = 0;
                id(system_ready) = true;

            - logger.log: "SYSTEM ARMERT"
            - script.execute: update_status_led

          else:
            - logger.log: "IKKE STABIL - PROEVER IGJEN"
            - script.execute: arm_system


  # =================================================
  # VAKTHUND FOR KJOERERETNING
  #
  # motion_direction settes optimistisk naar vi sender
  # en kommando, fordi Dexxo bruker et sekund eller to
  # paa aa rapportere tilbake.
  #
  # Gaar kommandoen tapt, kommer det aldri noen
  # bekreftelse, og retningen ville ellers blitt
  # staaende for godt. Da ville neste trykk blitt
  # tolket som "stopp" paa en port som staar stille.
  # =================================================
  - id: motion_watchdog
    mode: restart

    then:
      - delay: 8s

      - lambda: |-
          if (id(dexxo_state).state != "opening" &&
              id(dexxo_state).state != "closing") {
            id(motion_direction) = 0;
          }

      - script.execute: update_status_led


  # =================================================
  # ENKELT / DOBBELTTRYKK
  #
  # Brukes kun naar porten staar stille.
  #
  #   1 trykk: lukket -> aapne, aapen -> lukke
  #   2 trykk: -> 50 %
  # =================================================
  - id: click_timer
    mode: restart

    then:
      - delay: 450ms

      - if:
          condition:
            lambda: 'return !id(system_ready);'

          then:
            - lambda: 'id(click_count) = 0;'
            - logger.log: "IKKE ARMERT - KOMMANDO FORKASTET"

          else:

            # =====================================
            # DOBBELTTRYKK -> 50 %
            # =====================================
            - if:
                condition:
                  lambda: 'return id(click_count) >= 2;'

                then:
                  - lambda: |-
                      id(click_count) = 0;
                      id(stopped_direction) = 0;
                      id(motion_direction) = 0;

                  - logger.log: "DOBBELTTRYKK -> 50 PROSENT"

                  - homeassistant.action:
                      action: cover.set_cover_position
                      data:
                        entity_id: cover.dexxosmartio800
                        position: "50"

                  - script.execute: motion_watchdog

                # =================================
                # ENKELTTRYKK
                # =================================
                else:
                  - if:
                      condition:
                        lambda: 'return id(click_count) == 1;'

                      then:
                        - script.execute: single_click_action


      - lambda: 'id(click_count) = 0;'


  # =================================================
  # ENKELTTRYKK - AAPNE ELLER LUKKE
  #
  # SIKKERHETSVALG:
  #
  # Vil du at aapning skal kreve dobbelttrykk, flytt
  # aapne-grenen under til click_timer sin
  # dobbelttrykk-gren. En feiltrigging som lukker
  # porten er ubehagelig - en som aapner den staar
  # aapen til du oppdager det.
  # =================================================
  - id: single_click_action
    mode: restart

    then:

      # PORT LUKKET -> AAPNE HELT
      - if:
          condition:
            lambda: 'return id(dexxo_state).state == "closed";'

          then:
            - lambda: |-
                id(motion_direction) = 1;
                id(stopped_direction) = 0;

            - logger.log: "ENKELTTRYKK -> AAPNE"
            - script.execute: update_status_led

            - homeassistant.action:
                action: cover.open_cover
                data:
                  entity_id: cover.dexxosmartio800

            - script.execute: motion_watchdog

          else:

            # PORT AAPEN ELLER DELVIS AAPEN -> LUKK
            - if:
                condition:
                  lambda: 'return id(dexxo_state).state == "open";'

                then:
                  - lambda: |-
                      id(motion_direction) = -1;
                      id(stopped_direction) = 0;

                  - logger.log: "ENKELTTRYKK -> LUKK"
                  - script.execute: update_status_led

                  - homeassistant.action:
                      action: cover.close_cover
                      data:
                        entity_id: cover.dexxosmartio800

                  - script.execute: motion_watchdog

                else:
                  - logger.log: "UKJENT PORTSTATUS - INGEN KOMMANDO"


  # =================================================
  # LED STATUS
  #
  # GROENN = helt lukket
  # ROED   = helt aapen
  # BLAA   = kjoerer eller staar delvis aapen
  #
  # Blinkende roed (fra interval under) = ikke armert
  # =================================================
  - id: update_status_led
    mode: restart

    then:

      # Regn ut oensket farge foerst
      - lambda: |-
          int c = 0;

          std::string s   = id(dexxo_state).state;
          bool  has_pos   = id(dexxo_position).has_state();
          float pos       = has_pos ? id(dexxo_position).state : -1.0f;

          if (!id(system_ready)) {
            c = 0;                       // haandteres av blink
          }
          else if (s == "opening" || s == "closing" ||
                   id(motion_direction) != 0) {
            c = 3;                       // beveger seg
          }
          else if (s == "closed" || (has_pos && pos <= 1.0f)) {
            c = 1;                       // helt lukket
          }
          else if (has_pos && pos >= 99.0f) {
            c = 2;                       // helt aapen
          }
          else if (has_pos) {
            c = 3;                       // delvis aapen
          }
          else if (s == "open") {
            c = 2;                       // aapen, posisjon ukjent
          }

          id(led_color) = c;

      # Slukk alt
      - output.turn_off: led_red
      - output.turn_off: led_green
      - output.turn_off: led_blue

      # Tenn oensket farge
      - if:
          condition:
            lambda: 'return id(led_color) == 1;'
          then:
            - output.turn_on: led_green

      - if:
          condition:
            lambda: 'return id(led_color) == 2;'
          then:
            - output.turn_on: led_red

      - if:
          condition:
            lambda: 'return id(led_color) == 3;'
          then:
            - output.turn_on: led_blue


# ==================================================
# BLINK NAAR SYSTEMET IKKE ER ARMERT
#
# Gir en synlig indikasjon paa at knappen er sperret,
# i stedet for en helt moerk LED.
# ==================================================
interval:

  - interval: 400ms
    then:
      - if:
          condition:
            lambda: 'return !id(system_ready);'

          then:
            - lambda: 'id(blink_on) = !id(blink_on);'

            - output.turn_off: led_green
            - output.turn_off: led_blue

            - if:
                condition:
                  lambda: 'return id(blink_on);'
                then:
                  - output.turn_on: led_red
                else:
                  - output.turn_off: led_red


# ==================================================
# FYSISK KNAPP
#
# D1 = GPIO1
# D1 -> knapp -> GND
#
# delayed_on: 100ms er hovedforsvaret mot falske
# trykk fra radiostoey. 100 ms merkes ikke av en
# finger, men luker vekk stoeypulser som den gamle
# verdien paa 30 ms slapp rett gjennom.
#
# Dette erstatter IKKE avstoeyingen i maskinvaren
# beskrevet oeverst i filen.
# ==================================================
binary_sensor:

  - platform: gpio
    name: "Garasje knapp"
    id: garasje_knapp

    pin:
      number: GPIO1
      inverted: true
      mode:
        input: true
        pullup: true

    filters:
      - delayed_on: 100ms
      - delayed_off: 50ms

    # Logg hver tilstandsendring under feilsoeking.
    # Ser du endringer her uten at noen roerer
    # knappen, sitter problemet i inngangen.
    on_state:
      - logger.log:
          format: "KNAPP: %d  ARMERT: %d"
          args: [ 'id(garasje_knapp).state', 'id(system_ready)' ]


    on_press:
      - if:
          condition:
            and:
              - lambda: 'return id(system_ready);'
              - wifi.connected:
              - api.connected:

          then:

            # =========================================
            # STOPPET UNDER AAPNING -> LUKK
            # =========================================
            - if:
                condition:
                  lambda: 'return id(stopped_direction) == 1;'

                then:
                  - lambda: |-
                      id(stopped_direction) = 0;
                      id(motion_direction) = -1;
                      id(click_count) = 0;

                  - script.stop: click_timer
                  - logger.log: "STOPPET UNDER AAPNING -> LUKK"
                  - script.execute: update_status_led

                  - homeassistant.action:
                      action: cover.close_cover
                      data:
                        entity_id: cover.dexxosmartio800

                  - script.execute: motion_watchdog

                else:

                  # =================================
                  # STOPPET UNDER LUKKING -> AAPNE
                  # =================================
                  - if:
                      condition:
                        lambda: 'return id(stopped_direction) == -1;'

                      then:
                        - lambda: |-
                            id(stopped_direction) = 0;
                            id(motion_direction) = 1;
                            id(click_count) = 0;

                        - script.stop: click_timer
                        - logger.log: "STOPPET UNDER LUKKING -> AAPNE"
                        - script.execute: update_status_led

                        - homeassistant.action:
                            action: cover.open_cover
                            data:
                              entity_id: cover.dexxosmartio800

                        - script.execute: motion_watchdog

                      else:

                        # =============================
                        # PORTEN KJOERER -> STOPP
                        # =============================
                        - if:
                            condition:
                              lambda: |-
                                return id(motion_direction) != 0 ||
                                       id(dexxo_state).state == "opening" ||
                                       id(dexxo_state).state == "closing";

                            then:
                              - lambda: |-
                                  int dir = id(motion_direction);

                                  if (dir == 0) {
                                    if (id(dexxo_state).state == "opening") {
                                      dir = 1;
                                    }
                                    else if (id(dexxo_state).state == "closing") {
                                      dir = -1;
                                    }
                                  }

                                  id(stopped_direction) = dir;
                                  id(motion_direction) = 0;
                                  id(click_count) = 0;

                              - script.stop: click_timer
                              - script.stop: motion_watchdog
                              - logger.log: "PORT KJOERER -> STOPP"
                              - script.execute: update_status_led

                              - homeassistant.action:
                                  action: cover.stop_cover
                                  data:
                                    entity_id: cover.dexxosmartio800

                            # =========================
                            # PORTEN STAAR STILLE
                            # =========================
                            else:
                              - lambda: 'id(click_count)++;'
                              - script.execute: click_timer

          else:
            - logger.log: "TRYKK BLOKKERT - SYSTEM IKKE KLART"


    # Hvis knappen var aktiv ved oppstart, armeres
    # systemet foerst naar den er sluppet.
    on_release:
      - if:
          condition:
            lambda: 'return !id(system_ready);'
          then:
            - script.execute: arm_system
